<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EcoFactory - Login</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="login-container">

        <!-- Lado esquerdo -->
        <section class="login-content">

            <div class="logo">
                <div class="logo-icon">⚙</div>

                <div>
                    <h1>EcoFactory</h1>
                    <span>Indústria Inteligente</span>
                </div>
            </div>

            <div class="welcome">
                <h2>Bem-vindo de volta!</h2>

                <p>
                    Faça login para acessar<br>
                    sua conta
                </p>
            </div>

            <form id="loginForm">

    <div class="input-group">

        <label for="email">
            E-mail
        </label>

        <input
            type="email"
            id="email"
            placeholder="Digite seu e-mail"
            required
        >

    </div>


    <div class="input-group">

        <label for="senha">
            Senha
        </label>

        <input
            type="password"
            id="senha"
            placeholder="Digite sua senha"
            required
        >

    </div>


    <button
        type="submit"
        class="btn-login"
    >
        Entrar
    </button>


    <p class="cadastro-link">

        Não possui uma conta?

        <a href="cadastro.html">
            Criar conta
        </a>

    </p>

</form>


<script src="js/script.js"></script>


        </section>

        <!-- Lado direito -->
        <section class="illustration">

            <div class="sky">

                <div class="cloud cloud-1"></div>
                <div class="cloud cloud-2"></div>

                <!-- Sol -->
                <div class="sun"></div>

                <!-- Fábrica -->
                <div class="factory">

                    <div class="factory-building">

                        <div class="factory-roof"></div>

                        <div class="factory-window"></div>
                        <div class="factory-window"></div>
                        <div class="factory-window"></div>

                        <div class="factory-door"></div>

                    </div>

                    <!-- Chaminé -->
                    <div class="chimney">
                        <div class="smoke smoke-1"></div>
                        <div class="smoke smoke-2"></div>
                    </div>

                </div>

                <!-- Árvore -->
                <div class="tree tree-1">
                    <div class="tree-top"></div>
                    <div class="tree-trunk"></div>
                </div>

                <div class="tree tree-2">
                    <div class="tree-top"></div>
                    <div class="tree-trunk"></div>
                </div>

                <!-- Energia eólica -->
                <div class="wind-turbine">
                    <div class="turbine-blades">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>

                    <div class="turbine-pole"></div>
                </div>

                <!-- Montanhas -->
                <div class="mountains">
                    <div class="mountain mountain-1"></div>
                    <div class="mountain mountain-2"></div>
                </div>

                <!-- Grama -->
                <div class="ground"></div>

            </div>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
